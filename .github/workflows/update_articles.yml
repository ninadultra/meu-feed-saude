name: 🌸 Atualizar Artigos Diariamente

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-articles:
    name: Buscar e salvar artigos
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🔍 Buscar artigos
        run: python fetch_articles.py

      - name: 💾 Salvar artigos atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --staged --quiet || git commit -m "🌸 Artigos atualizados — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y às %H:%M')"
          git push
